<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Yurii Kucher — AI Motion Designer</title>
<meta name="description" content="Portfolio of Yurii Kucher — AI Motion Designer. Motion design, AI generation, and hybrid AI×Motion work.">
<style>
  :root {
    --bg: #0a0a0c;
    --surface: #141418;
    --surface2: #1d1d23;
    --text: #f2f2f5;
    --muted: #8b8b96;
    --accent: #7c6cff;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    min-height: 100vh;
  }

  /* ---------- Header ---------- */
  header {
    padding: max(20px, env(safe-area-inset-top)) 20px 8px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .brand h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .brand .role {
    font-size: 13px; color: var(--muted); font-weight: 500;
  }
  .brand .role b { color: var(--accent); font-weight: 600; }
  .tagline { margin-top: 6px; font-size: 13px; color: var(--muted); line-height: 1.5; max-width: 520px; }

  /* ---------- Filter pills ---------- */
  nav {
    position: sticky; top: 0; z-index: 50;
    background: linear-gradient(var(--bg) 75%, transparent);
    padding: 12px 0 14px;
  }
  .pills {
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    padding: 0 20px; max-width: 1200px; margin: 0 auto;
  }
  .pills::-webkit-scrollbar { display: none; }
  .pill {
    flex: 0 0 auto;
    padding: 8px 15px;
    border-radius: 100px;
    background: var(--surface);
    color: var(--muted);
    font-size: 13px; font-weight: 600;
    border: 1px solid #26262e;
    cursor: pointer;
    transition: all .18s ease;
    user-select: none;
  }
  .pill .n { opacity: .55; font-weight: 500; margin-left: 4px; font-size: 12px; }
  .pill.active {
    background: var(--text); color: #0b0b0d; border-color: var(--text);
  }
  .pill.active .n { opacity: .6; }

  /* ---------- Grid ---------- */
  main { max-width: 1200px; margin: 0 auto; padding: 4px 14px 40px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  @media (min-width: 640px)  { .grid { grid-template-columns: repeat(3, 1fr); gap: 14px; } }
  @media (min-width: 900px)  { .grid { grid-template-columns: repeat(4, 1fr); } }
  @media (min-width: 1150px) { .grid { grid-template-columns: repeat(5, 1fr); } }

  .card {
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--surface);
    aspect-ratio: 9 / 16;
    cursor: pointer;
    transform: translateZ(0);
    transition: transform .22s ease, box-shadow .22s ease;
    animation: cardIn .4s ease both;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (hover: hover) {
    .card:hover { transform: translateY(-3px) scale(1.015); box-shadow: 0 12px 32px rgba(0,0,0,.5); }
  }
  .card img, .card video {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .card video { position: absolute; inset: 0; }
  .card .meta {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 26px 10px 9px;
    background: linear-gradient(transparent, rgba(0,0,0,.72));
    display: flex; align-items: flex-end; justify-content: space-between; gap: 6px;
    pointer-events: none;
  }
  .card .title { font-size: 12.5px; font-weight: 600; line-height: 1.25; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  .card .dur {
    font-size: 10.5px; font-weight: 600; color: #fff;
    background: rgba(0,0,0,.45); backdrop-filter: blur(6px);
    padding: 2px 6px; border-radius: 6px; flex: 0 0 auto;
  }
  .card .tag {
    position: absolute; top: 8px; left: 8px;
    font-size: 9.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: #fff; background: rgba(0,0,0,.42); backdrop-filter: blur(6px);
    padding: 3px 7px; border-radius: 6px;
    pointer-events: none;
  }

  /* ---------- Section headers within grid flow ---------- */
  .sec-h {
    grid-column: 1 / -1;
    display: flex; align-items: baseline; gap: 10px;
    margin: 18px 2px 2px;
  }
  .sec-h:first-child { margin-top: 4px; }
  .sec-h h2 { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .sec-h span { font-size: 12px; color: var(--muted); }

  /* ---------- Viewer ---------- */
  .viewer {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(5,5,8,.94);
    backdrop-filter: blur(20px);
    display: none;
    align-items: center; justify-content: center;
    touch-action: pan-y;
  }
  .viewer.open { display: flex; }
  .stage {
    position: relative;
    height: min(100dvh, 100%);
    max-height: 100dvh;
    aspect-ratio: 9 / 16;
    max-width: 100vw;
    display: flex; align-items: center;
  }
  .stage video {
    width: 100%; height: 100%;
    object-fit: contain;
    border-radius: 0;
  }
  @media (min-width: 640px) {
    .stage { height: 92dvh; }
    .stage video { border-radius: 16px; background: #000; }
  }
  .v-top {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5;
    padding: max(14px, env(safe-area-inset-top)) 16px 30px;
    background: linear-gradient(rgba(0,0,0,.55), transparent);
    display: flex; justify-content: space-between; align-items: center;
    border-radius: 16px 16px 0 0;
  }
  .v-title { font-size: 14px; font-weight: 600; }
  .v-sub { font-size: 11px; color: rgba(255,255,255,.65); margin-top: 2px; }
  .v-close {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,.14); border: none; color: #fff;
    font-size: 16px; cursor: pointer; display: grid; place-items: center;
    flex: 0 0 auto;
  }
  .v-arrow {
    position: fixed; top: 50%; transform: translateY(-50%); z-index: 6;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,.1); border: none; color: #fff;
    font-size: 18px; cursor: pointer;
    display: none;
  }
  @media (hover: hover) and (min-width: 700px) {
    .viewer.open .v-arrow { display: block; }
  }
  .v-prev { left: max(18px, calc(50vw - 92dvh * 9/16/1 - 70px)); }
  .v-next { right: max(18px, calc(50vw - 92dvh * 9/16/1 - 70px)); }
  .v-arrow:disabled { opacity: .25; cursor: default; }
  .v-count {
    position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    font-size: 12px; color: rgba(255,255,255,.6); z-index: 6;
    background: rgba(0,0,0,.35); padding: 4px 12px; border-radius: 100px;
    pointer-events: none;
  }

  /* ---------- Footer ---------- */
  footer {
    max-width: 1200px; margin: 0 auto;
    padding: 10px 20px calc(30px + env(safe-area-inset-bottom));
    color: var(--muted); font-size: 13px; line-height: 1.6;
    border-top: 1px solid #1c1c22;
  }
  footer a { color: var(--text); text-decoration: none; font-weight: 600; }
  footer a:hover { color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Yurii Kucher</h1>
    <div class="role"><b>AI</b> Motion Designer</div>
  </div>
  <p class="tagline">Motion design, AI video generation, and the space in between. Selected work, best viewed with sound on.</p>
</header>

<nav>
  <div class="pills" id="pills"></div>
</nav>

<main><div class="grid" id="grid"></div></main>

<footer id="contact">
  Open to projects and collaborations.<br>
  <a href="mailto:urakucer5@gmail.com">urakucer5@gmail.com</a>
</footer>

<div class="viewer" id="viewer">
  <button class="v-arrow v-prev" id="vPrev">‹</button>
  <div class="stage" id="stage">
    <div class="v-top">
      <div>
        <div class="v-title" id="vTitle"></div>
        <div class="v-sub" id="vSub"></div>
      </div>
      <button class="v-close" id="vClose">✕</button>
    </div>
    <video id="vVideo" playsinline controls preload="auto"></video>
  </div>
  <button class="v-arrow v-next" id="vNext">›</button>
  <div class="v-count" id="vCount"></div>
</div>

<script>
const CATS = {
  motion: { label: "Motion",      sub: "Hand-crafted motion design" },
  aim:    { label: "AI × Motion", sub: "AI generation + motion design" },
  ai:     { label: "AI",          sub: "Fully AI-generated" },
  ugc:    { label: "UGC · AI",    sub: "AI talking-head / UGC style" },
};

const WORKS = [
  // ---- Motion ----
  { cat: "motion", slug: "Motion__Authenticator.MD",    title: "Authenticator", dur: 26 },
  { cat: "motion", slug: "Motion__Printer.MD",          title: "Printer",       dur: 21 },
  { cat: "motion", slug: "Motion__Speeche__inner_video",title: "Speechy",       dur: 25 },
  { cat: "motion", slug: "Motion__Revealory_inner_video",title:"Revealory",     dur: 17 },
  // ---- AI + Motion ----
  { cat: "aim", slug: "AI+Motion__AI_tools_01",   title: "AI Tools",       dur: 26 },
  { cat: "aim", slug: "AI+Motion__AI_Detector",   title: "AI Detector",    dur: 25 },
  { cat: "aim", slug: "AI+Motion__AI_Detector_02",title: "AI Detector II", dur: 42 },
  { cat: "aim", slug: "AI+Motion__Voice_Notes",   title: "Voice Notes",    dur: 42 },
  { cat: "aim", slug: "AI+Motion__E-com_01",      title: "E-commerce",     dur: 84 },
  { cat: "aim", slug: "AI+Motion__AI_tools_02",   title: "AI Tools II",    dur: 50 },
  { cat: "aim", slug: "AI+Motion__Recorder_01",   title: "Recorder",       dur: 32 },
  { cat: "aim", slug: "AI+Motion__Podcast",       title: "Podcast",        dur: 26 },
  { cat: "aim", slug: "AI+Motion__Metrix_01",     title: "Metrix",         dur: 21 },
  { cat: "aim", slug: "AI+Motion__Interview",     title: "Interview",      dur: 17 },
  { cat: "aim", slug: "AI+Motion__AI_Girl",       title: "AI Girl",        dur: 22 },
  // ---- AI ----
  { cat: "ai", slug: "AI__Lumway",         title: "Lumway",              dur: 10 },
  { cat: "ai", slug: "AI__Chars_Vitamins", title: "Vitamins Characters", dur: 31 },
  { cat: "ai", slug: "AI__Auth_01.MD",     title: "Authenticator",       dur: 35 },
  { cat: "ai", slug: "AI__QR_01",          title: "QR",                  dur: 22 },
  { cat: "ai", slug: "AI__Remote",         title: "Remote",              dur: 21 },
  { cat: "ai", slug: "AI__TV_remote",      title: "TV Remote",           dur: 18 },
  { cat: "ai", slug: "AI__IG_photos",      title: "IG Photos",           dur: 17 },
  { cat: "ai", slug: "AI__AI_Girl_01",     title: "AI Girl",             dur: 15 },
  // ---- UGC (AI talking head) ----
  { cat: "ugc", slug: "AI__UGC_Talking_head__Learniq",     title: "Learniq",       dur: 37 },
  { cat: "ugc", slug: "AI__UGC_Talking_head__Girl",        title: "Girl",          dur: 69 },
  { cat: "ugc", slug: "AI__UGC_Talking_head__E-com_01",    title: "E-commerce I",  dur: 80 },
  { cat: "ugc", slug: "AI__UGC_Talking_head__E-Com_02",    title: "E-commerce II", dur: 56 },
  { cat: "ugc", slug: "AI__UGC_Talking_head__Recorder_02", title: "Recorder",      dur: 59 },
  { cat: "ugc", slug: "AI__UGC_Talking_head__Speaker",     title: "Speaker",       dur: 43 },
];

const MEDIA = "media/";
const fmt = s => `0:${String(s).padStart(2, "0")}`.replace(/^0:(\d\d)$/, (m,d)=> s>=60 ? `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}` : `0:${d}`);
const dur = s => s >= 60 ? `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}` : `0:${String(s).padStart(2,"0")}`;

let filter = "all";
let list = [];      // currently displayed works (viewer navigates within this)
let cur = -1;

const grid = document.getElementById("grid");
const pillsEl = document.getElementById("pills");

function renderPills() {
  const items = [["all", "All", WORKS.length],
    ...Object.entries(CATS).map(([k, c]) => [k, c.label, WORKS.filter(w => w.cat === k).length])];
  pillsEl.innerHTML = items.map(([k, label, n]) =>
    `<div class="pill ${filter === k ? "active" : ""}" data-f="${k}">${label}<span class="n">${n}</span></div>`).join("");
  pillsEl.querySelectorAll(".pill").forEach(p =>
    p.addEventListener("click", () => { filter = p.dataset.f; render(); }));
}

function render() {
  renderPills();
  list = filter === "all" ? [...WORKS] : WORKS.filter(w => w.cat === filter);
  let html = "";
  let lastCat = null;
  list.forEach((w, i) => {
    if (filter === "all" && w.cat !== lastCat) {
      lastCat = w.cat;
      html += `<div class="sec-h"><h2>${CATS[w.cat].label}</h2><span>${CATS[w.cat].sub}</span></div>`;
    }
    html += `
      <div class="card" data-i="${i}" style="animation-delay:${Math.min(i * 30, 300)}ms">
        <img src="${MEDIA}${encodeURIComponent(w.slug)}.jpg" alt="${w.title}" loading="lazy">
        ${filter === "all" ? "" : `<span class="tag">${CATS[w.cat].label}</span>`}
        <div class="meta">
          <div class="title">${w.title}</div>
          <div class="dur">${dur(w.dur)}</div>
        </div>
      </div>`;
  });
  grid.innerHTML = html;
  grid.querySelectorAll(".card").forEach(c => {
    c.addEventListener("click", () => open(+c.dataset.i));
    if (matchMedia("(hover: hover)").matches) {
      let pv = null;
      c.addEventListener("mouseenter", () => {
        const w = list[+c.dataset.i];
        pv = document.createElement("video");
        pv.src = MEDIA + encodeURIComponent(w.slug) + ".mp4";
        pv.loop = true; pv.playsInline = true;
        pv.addEventListener("canplay",()=>{if(!pv)return;pv.muted=false;pv.play().catch(()=>{if(!pv)return;pv.muted=true;pv.play().catch(()=>{})})});
        c.insertBefore(pv, c.querySelector(".meta"));
      });
      c.addEventListener("mouseleave", () => { if (pv) { pv.remove(); pv = null; } });
    }
  });
}

/* ---------- Viewer ---------- */
const viewer = document.getElementById("viewer");
const vVideo = document.getElementById("vVideo");
const vTitle = document.getElementById("vTitle");
const vSub = document.getElementById("vSub");
const vCount = document.getElementById("vCount");
const vPrev = document.getElementById("vPrev");
const vNext = document.getElementById("vNext");

function open(i) {
  cur = i;
  const w = list[i];
  vVideo.src = MEDIA + encodeURIComponent(w.slug) + ".mp4";
  vVideo.poster = MEDIA + encodeURIComponent(w.slug) + ".jpg";
  vTitle.textContent = w.title;
  vSub.textContent = CATS[w.cat].label;
  vCount.textContent = `${i + 1} / ${list.length}`;
  vPrev.disabled = i === 0;
  vNext.disabled = i === list.length - 1;
  viewer.classList.add("open");
  document.body.style.overflow = "hidden";
  vVideo.play().catch(() => {});
}
function close() {
  viewer.classList.remove("open");
  vVideo.pause();
  vVideo.removeAttribute("src");
  vVideo.load();
  document.body.style.overflow = "";
  cur = -1;
}
function step(d) {
  const n = cur + d;
  if (n >= 0 && n < list.length) open(n);
}

document.getElementById("vClose").addEventListener("click", close);
vPrev.addEventListener("click", () => step(-1));
vNext.addEventListener("click", () => step(1));
viewer.addEventListener("click", e => { if (e.target === viewer) close(); });
document.addEventListener("keydown", e => {
  if (!viewer.classList.contains("open")) return;
  if (e.key === "Escape") close();
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});

/* swipe left/right = prev/next, swipe down = close */
let tx = 0, ty = 0;
viewer.addEventListener("touchstart", e => {
  tx = e.touches[0].clientX; ty = e.touches[0].clientY;
}, { passive: true });
viewer.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) step(dx < 0 ? 1 : -1);
  else if (dy > 90 && Math.abs(dy) > Math.abs(dx) * 1.4) close();
}, { passive: true });

render();
</script>
</body>
</html>
